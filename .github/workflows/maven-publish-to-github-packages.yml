# Publishes to GitHub Packages when a GitHub release is published. The release tag sets the version.

name: Publish to GitHub Packages

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
      - name: Set the version from the release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *SNAPSHOT*|"") echo "::error::Release tag '$GITHUB_REF_NAME' is not a release version"; exit 1 ;;
          esac
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.22.0:set -DnewVersion="$version" -DgenerateBackupPoms=false
      - name: Build, test and publish
        run: mvn -B -ntp deploy -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
